id = "tg5040-brick-nextui"
name = "TrimUI Brick (NextUI, tg5040)"
model = "TrimUI Brick"

# What an owner of this firmware expects of anything running on it. Only what was OBSERVED on
# the Brick is stated; the rest is NextUI's to document, at the repository named under [os].
[os_conventions]
building = "Target aarch64 Linux, glibc 2.28 or older. Native SDL2 is in /usr/trimui/lib; set LD_LIBRARY_PATH in your start.sh. PortMaster, Python and pygame are optional, not guaranteed. Bundle other dependencies. Use the reported input mapping, not PC button indices. Apps/games start in their installed entry point directory; use relative paths and include a quit button."
confirm_and_back = "A confirms and B goes back. A is the right-hand face button, as on Nintendo controllers."
volume = "The volume buttons change the system volume everywhere, in steps of 5%."
mute = "The switch on the side mutes the speaker. NextUI lets the owner give it other effects as well."
closing_an_app = "Tools and apps close themselves: NextUI has no button that closes them from outside."
launcher = "Apps are listed under Tools. Games installed by Goblin Link are also under Tools as standalone Paks, without PortMaster."
more = "Shortcuts, sleep and the in-game menu are described in the operating system's repository."

[os]
name = "NextUI"
version_file = "/mnt/SDCARD/.system/version.txt"
base = "Tina Linux"
repository = "github.com/LoveRetro/NextUI"

# Read from the kernel and sysfs on the Brick 2026-11-12: the display driver has an LCD output
# and no other; there is no motion sensor, positioning receiver or camera device; the audio
# codec has a jack. No USB accessory has been tried.
[hardware]
touch = false
keyboard = false
wifi = true
bluetooth = true
headphone_jack = true
video_out = false
motion_sensors = false
gps = false
camera = false
cpu = "Allwinner A133, ARM Cortex-A53"
gpu = "Imagination PowerVR GE8300, OpenGL ES 3.2"
usb_host = "One USB 2.0 host port, with the usual kernel drivers (input, storage, serial, audio, camera). Untested."
usb_device = "The other port is a USB device port. It carries adb, which gives a connected computer a root shell. Mass storage and MTP are in the kernel but not set up."

# NextUI runs three TrimUI devices as "tg5040" and tells them apart by the model name in
# TrimUI's own launcher, exporting it as DEVICE. Either way of knowing is enough here.
[detect]
env = { PLATFORM = "tg5040", DEVICE = "brick" }

[detect.string_in_file]
path = "/usr/trimui/bin/MainUI"
text = "Trimui Brick"

[display]
width = 1024
height = 768
scale = 2.0
rotation = 0
# No brightness hook: NextUI sets the backlight through ioctls on /dev/disp, which a shell
# script cannot reach. The capability is therefore reported as unavailable.

[paths]
data = "/mnt/SDCARD/.userdata/tg5040/goblin-link"
games = "/mnt/SDCARD/Roms"
tools = "/mnt/SDCARD/Tools/tg5040"
tmp = "/tmp"

# Where software is. The base system's packages, its libraries, and what the owner added.
[software]
package_database = "/usr/lib/opkg/status (opkg; the base system's packages and versions)"
library_dirs = ["/usr/trimui/lib"]

[[software.places]]
path = "/usr/lib"
what = "The base system's other libraries."

[[software.places]]
path = "/mnt/SDCARD/Emus/tg5040"
what = "Emulator and runtime paks the owner has installed, one folder each. A Ports pak, if present, carries its own programs and libraries."

[[software.places]]
path = "/mnt/SDCARD/Tools/tg5040"
what = "Tool paks: apps listed under Tools, one folder each."

[sdl]
library_path = ["/usr/trimui/lib"]

[input]
map = "gamepad-xbox360"
layout = "nintendo"
# DECLARED by NextUI's platform.h and OBSERVED on the Brick 2026-11-12 (raw SDL events logged by
# goblin-ui with GOBLIN_UI_INPUT_LOG=1). The D-pad is hat 0; L2/R2 are axes resting at -32768.
b = 0
a = 1
y = 2
x = 3
l1 = 4
r1 = 5
select = 6
start = 7
menu = 8
f1 = 9
f2 = 10
vol_down = 13
vol_up = 14
l2_axis = 2
r2_axis = 5

[input.glyphs]
a = "btn-a"
b = "btn-b"
x = "btn-x"
y = "btn-y"

[audio]
playback = "default"
# MIC1 is capture channel 0 of the on-chip codec. The platform's second capture card (AC107)
# does not exist on the Brick.
capture = "hw:0,0"
capture_channels = 2
capture_use = "left"
output_hook = "hooks/output.sh"
mic_gain_hook = "hooks/mic-gain.sh"
mic_gain_range = [0, 31]

[leds]
driver = "trimui-led-anim"
sysfs_path = "/sys/class/led_anim"
zones = ["f1", "f2", "m", "l", "r", "lr"]
max_brightness = 60
presence_zones = ["m", "l", "r"]
# The face pills keep NextUI's white except while Muse works or a reply waits.
accent_zones = ["f1", "f2"]
frame_leds = 23

[leds.locations]
f1 = "face pill button nearer the D-pad (OBSERVED by camera)"
f2 = "face pill button nearer the A/B/X/Y cluster (OBSERVED by camera)"
m = "rear LEDs (OBSERVED by the owner 2026-11-12)"
l = "rear LEDs, with m and r (OBSERVED by the owner 2026-11-12)"
r = "rear LEDs, with m and l (OBSERVED by the owner 2026-11-12)"
lr = "l and r together (rear)"

[rumble]
hook = { path = "hooks/rumble.sh", timeout_ms = 5000 }
max_ms = 2000

[power]
battery = "/sys/class/power_supply/axp2202-battery"
usb = "/sys/class/power_supply/axp2202-usb"
thermal_zone = "/sys/class/thermal/thermal_zone0/temp"
stay_awake_hook = "hooks/stay-awake.sh"

[autostart]
hook = "hooks/autostart.sh"

# Radio bring-up for pairing, and the advertising data this controller needs set by hand.
[bluetooth]
hook = { path = "hooks/bluetooth.sh", timeout_ms = 20000 }

[firmware]
register_hook = "hooks/register.sh"

[tls]
ca_bundle = "embedded"
