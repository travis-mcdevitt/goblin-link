[package]
name = "goblin-platform"
description = "Platform adapter loader: capabilities, LEDs, rumble, power, paths, autostart"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
