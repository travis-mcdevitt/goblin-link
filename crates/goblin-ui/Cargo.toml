[package]
name = "goblin-ui"
description = "SDL2 front end for the Goblin Link handheld client (renders the goblin-ui-kit buffer)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "goblin-ui"
path = "src/main.rs"

[dependencies]
goblin-ui-kit = { path = "../goblin-ui-kit" }
goblin-ipc = { path = "../goblin-ipc", features = ["blocking"] }
goblin-platform = { path = "../goblin-platform" }
serde_json = "1"
libc = "0.2"
sdl2 = { version = "0.38", default-features = false }

[dev-dependencies]
png = "0.18"
tempfile = "3"
