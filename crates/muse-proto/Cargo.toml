[package]
name = "muse-proto"
description = "Goblin Link wire formats: Noise XX handshake, transport framing, service envelopes, control messages and BLE chunking (no I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2.5"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = "1.7"

[dev-dependencies]
hex = "0.4"
proptest = "1"
