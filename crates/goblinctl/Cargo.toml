[package]
name = "goblinctl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
goblin-platform = { path = "../goblin-platform" }
goblin-ipc = { path = "../goblin-ipc", features = ["blocking"] }
serde = "1"
serde_json = "1"
thiserror = "1"
