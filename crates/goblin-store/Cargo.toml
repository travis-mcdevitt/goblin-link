[package]
name = "goblin-store"
description = "On-disk state for the Goblin Link daemon: profiles, settings, caches, spool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
goblin-ipc = { path = "../goblin-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
