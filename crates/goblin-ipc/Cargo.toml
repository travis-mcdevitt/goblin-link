[package]
name = "goblin-ipc"
description = "Daemon/client IPC protocol types, codec, client and server for Goblin Link"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Async tokio client.
client = ["dep:tokio"]
# Blocking std-only client with a non-blocking `try_recv` API.
blocking = []
# Async tokio server, event bus and socket helpers.
server = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
tokio = { version = "1", optional = true, features = ["net", "io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
