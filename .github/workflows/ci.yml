name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test runner regression
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          --tmpfs /tmp:exec -v "$PWD:/src:ro" -w /src
          ubuntu:24.04 sh tools/test-container-runner.sh
      - name: Test
        run: tools/test-in-container.sh --locked --workspace
      - name: Hermes plugin tests
        # The plugin supports websockets 13 to 17, which name the frame limit differently:
        # run every test on the newest, and the frame test again on the oldest line we ship.
        run: >-
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1
          -v "$PWD/hermes-plugin:/p:ro" -w /p python:3.12-slim
          sh -ec 'pip() { python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir --root-user-action=ignore "$@"; };
          pip cryptography==44.0.0 pillow==11.0.0 websockets==17.0;
          for t in tests/test_*.py; do echo "== $t"; python3 "$t"; done;
          pip websockets==13.1; echo "== tests/test_frames.py (websockets 13.1)"; python3 tests/test_frames.py'
      - name: Start script
        # As root in its own container: the script writes /run and /mnt/UDISK, as on the device.
        run: >-
          docker run --rm --init --network none
          --tmpfs /tmp:exec -v "$PWD:/src:ro" -w /src
          python:3.12-slim python3 tools/test-start-daemon.py
      - name: Package fixture binaries
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          --tmpfs /tmp:exec -v "$PWD:/src:ro" -w /src
          python:3.12-slim python3 tools/test-packaging.py
