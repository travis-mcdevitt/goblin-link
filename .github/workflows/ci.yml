name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test runner regression
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          --tmpfs /tmp:exec -v "$PWD:/src:ro" -w /src
          ubuntu:24.04 sh tools/test-container-runner.sh
      - name: Test
        run: tools/test-in-container.sh --locked --workspace
      - name: Hermes plugin tests
        # The plugin supports websockets 13 to 17, which name the frame limit differently:
        # run every test on the newest, and the frame test again on the oldest line we ship.
        run: >-
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1
          -v "$PWD/hermes-plugin:/p:ro" -w /p python:3.12-slim
          sh -ec 'pip() { python3 -m pip install --quiet --disable-pip-version-check --no-cache-dir --root-user-action=ignore "$@"; };
          pip cryptography==44.0.0 pillow==11.0.0 websockets==17.0;
          for t in tests/test_*.py; do echo "== $t"; python3 "$t"; done;
          pip websockets==13.1; echo "== tests/test_frames.py (websockets 13.1)"; python3 tests/test_frames.py'
      - name: Start script
        # As root in its own container: the script writes /run and /mnt/UDISK, as on the device.
        run: >-
          docker run --rm --init --network none
          --tmpfs /tmp:exec -v "$PWD:/src:ro" -w /src
          python:3.12-slim python3 tools/test-start-daemon.py
      - name: Package fixture binaries
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          --tmpfs /tmp:exec -v "$PWD:/src:ro" -w /src
          python:3.12-slim python3 tools/test-packaging.py
      - name: Release checks
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)" -e PYTHONDONTWRITEBYTECODE=1
          --tmpfs /tmp:exec -v "$PWD:/src:ro" -w /src
          python:3.12-slim python3 tools/test-release.py

  pak:
    # Builds the pak a tester can unzip over an installed one. It links against stand-ins,
    # never a handheld's libraries, and publishes nothing: the zip stays with the run.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The PR's own commit, not the merge with main: that is the commit a tester names.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tools/ci-build-pak.sh
          mkdir "$RUNNER_TEMP/pak"
          mv target/pak/Goblin.Link.pak.zip "$RUNNER_TEMP/pak/Goblin.Link.pak-${COMMIT:0:7}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/pak/*.zip
          # The zip as package-pak.sh made it (the layout the Pak Store installs), not
          # wrapped in a second one. The artifact takes the file's name.
          archive: false
          if-no-files-found: error
          retention-days: 14
