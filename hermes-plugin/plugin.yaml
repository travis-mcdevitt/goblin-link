name: goblin-link
label: Goblin Link
kind: platform
version: 0.1.0
description: Chat with Hermes from a Goblin Link handheld, and let Hermes use the handheld's commands under its owner's switches.
author: Goblin Link contributors
# websockets keeps its frame limit under another name from 16 on; 13 to 17 are tested
# (tests/test_frames.py). Pillow is optional: only handheld_identity's picture needs it.
python_dependencies:
  - cryptography
  - websockets>=13,<18
provides_tools:
  - handheld_commands
  - handheld_run
  - handheld_identity
optional_env:
  - name: GOBLIN_LINK_HOSTS
    description: Addresses a handheld can reach this machine at, comma-separated, in the order to try them (a LAN address, a Tailscale name)
    prompt: Addresses for handhelds
    password: false
  - name: GOBLIN_LINK_PORT
    description: Port to listen on for handhelds (default 47832)
    prompt: Port for handhelds
    password: false
  - name: GOBLIN_LINK_BIND
    description: Address to listen on (default 0.0.0.0)
    prompt: Listen address
    password: false
  - name: GOBLIN_LINK_AGENT_NAME
    description: Name the agent is shown with on handhelds until it chooses one itself (default Hermes)
    prompt: Agent name on handhelds
    password: false
